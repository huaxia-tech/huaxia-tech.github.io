<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>外汇速查（在线 + 离线）</title>
<style>
  body {
    font-family: Arial;
    padding: 20px;
    background: #f7f7f7;
  }
  .box {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px #ddd;
    max-width: 500px;
    margin: auto;
  }
  select, input, button {
    padding: 8px;
    font-size: 16px;
    margin: 5px 0;
  }
  #result {
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="box">
  <h2>外汇速查（实时 + 本地兜底）</h2>

  <div>
    <label>金额：</label>
    <input id="amount" type="number" value="100">
  </div>

  <div>
    <label>从：</label>
    <select id="from">
      <option value="USD">美元 USD</option>
      <option value="EUR">欧元 EUR</option>
      <option value="JPY">日元 JPY</option>
      <option value="CNY">人民币 CNY</option>
    </select>
  </div>

  <div>
    <label>到：</label>
    <select id="to">
      <option value="CNY">人民币 CNY</option>
      <option value="USD">美元 USD</option>
      <option value="EUR">欧元 EUR</option>
      <option value="JPY">日元 JPY</option>
    </select>
  </div>

  <button onclick="convert()">查询汇率并换算</button>

  <div id="result"></div>
</div>

<script>
  async function convert() {
    const amount = parseFloat(document.getElementById("amount").value || "0");
    const from = document.getElementById("from").value;
    const to = document.getElementById("to").value;
    const resultDiv = document.getElementById("result");

    if (!amount || amount <= 0) {
      resultDiv.innerHTML = "请输入有效金额。";
      return;
    }

    if (from === to) {
      resultDiv.innerHTML = `${amount} ${from} = ${amount.toFixed(4)} ${to}<br>汇率：1 ${from} = 1`;
      return;
    }

    try {
      // 优先级 1：直接通过 API 获取（如 JPY -> CNY，若直接支持）
      let rate = await fetchRate(from, to);

      // 优先级 2：反向获取并取倒数（如 CNY -> JPY，转为 1 / (JPY -> CNY)）
      if (!rate) {
        const reverseRate = await fetchRate(to, from);
        if (reverseRate) {
          rate = 1 / reverseRate;
        }
      }

      // 优先级 3：通过 USD 进行交叉换算（核心逻辑）
      // 例如：JPY -> CNY，先算 JPY -> USD，再算 USD -> CNY
      if (!rate && from !== "USD" && to !== "USD") {
        console.log(`正在尝试通过 USD 中介交叉计算 ${from} -> ${to}...`);
        
        const fromToUsd = await getRateWithReverse(from, "USD"); // 获得 1 from = ? USD
        const usdToTarget = await getRateWithReverse("USD", to);  // 获得 1 USD = ? to

        if (fromToUsd && usdToTarget) {
          rate = fromToUsd * usdToTarget; // 拼接算得 1 from = ? to
        }
      }

      // 在线汇率（直连/反向/交叉）计算成功并展示
      if (rate) {
        const converted = amount * rate;
        resultDiv.innerHTML =
          `${amount} ${from} ≈ ${converted.toFixed(4)} ${to}<br>` +
          `实时汇率：1 ${from} = ${rate.toFixed(6)} ${to}`;
        return;
      }
    } catch (e) {
      console.warn("在线查询或交叉计算异常，准备走本地 JSON 兜底:", e);
    }

    // 优先级 4：最后的最后才走本地 JSON 兜底
    try {
      console.log("在线获取失败，触发本地 JSON 兜底");
      const localRes = await fetch("forex_local.json");
      const localData = await localRes.json();

      if (localData[from] && localData[from][to]) {
        const rate = localData[from][to];
        const converted = amount * rate;

        resultDiv.innerHTML =
          `${amount} ${from} ≈ ${converted.toFixed(4)} ${to}<br>` +
          `本地汇率：1 ${from} = ${rate}`;
      } else {
        resultDiv.innerHTML = "本地汇率表中没有该币种组合。";
      }
    } catch (e) {
      resultDiv.innerHTML = "无法读取本地汇率表。";
    }
  }

  // 基础请求函数：USD<->CNY 走 Frankfurter，其它走 biquote
  async function fetchRate(base, quote) {
    // 特殊处理：USD 和 CNY 互转使用 Frankfurter 接口
    if ((base === "USD" && quote === "CNY") || (base === "CNY" && quote === "USD")) {
      try {
        const res = await fetch(`https://api.frankfurter.dev/v1/latest?from=${base}&to=${quote}`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.rates && data.rates[quote]) {
            return data.rates[quote];
          }
        }
      } catch (e) {
        console.warn("Frankfurter API 异常", e);
      }
    }

    // 默认处理：其它币种走 biquote 接口
    try {
      const symbolKey = `${base}${quote}`;
      const res = await fetch(`https://biquote.io/api/latest?symbols=${symbolKey}`);
      if (!res.ok) return null;

      const data = await res.json();
      if (data && data[symbolKey]) {
        const item = data[symbolKey];
        const val = item.mid || item.bid || item.ask || item.last;
        if (val && !isNaN(val)) {
          return val;
        }
      }
    } catch (e) {
      return null;
    }
    return null;
  }

  // 辅助方法：保证能拿到某币种与 USD 的汇率（正查不到就查反向取倒数）
  async function getRateWithReverse(base, quote) {
    let rate = await fetchRate(base, quote);
    if (!rate) {
      const rev = await fetchRate(quote, base);
      if (rev) rate = 1 / rev;
    }
    return rate;
  }
</script>

</body>
</html>
