<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>上传文件 · 华夏小课堂后台</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  .dropzone {
    border: 2px dashed #888;
    padding: 40px;
    text-align: center;
    border-radius: 10px;
    background: #fafafa;
    cursor: pointer;
  }
  .dropzone.dragover {
    background: #e3f2fd;
    border-color: #0d6efd;
  }
</style>
</head>

<body class="container py-4">

<h2>📁 上传文件（最大 1GB）</h2>
<p class="text-muted">拖拽文件到框内，或点击选择文件。</p>

<div id="dropzone" class="dropzone mb-3">
  将文件拖拽到这里，或点击选择
</div>

<input type="file" id="fileInput" class="form-control mb-3" style="display:none">

<button id="uploadBtn" class="btn btn-primary">开始上传</button>

<div class="progress mt-3" style="height:20px; display:none;" id="progressBox">
  <div id="progressBar" class="progress-bar" style="width:0%">0%</div>
</div>

<div id="status" class="mt-3"></div>

<script>
const MAX_SIZE = 1024 * 1024 * 1024; // 1GB
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
let selectedFile = null;

// 点击选择文件
dropzone.addEventListener('click', () => fileInput.click());

// 拖拽文件
dropzone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropzone.classList.add('dragover');
});
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  selectedFile = e.dataTransfer.files[0];
  dropzone.textContent = "已选择文件：" + selectedFile.name;
});

// 选择文件（点击）
fileInput.addEventListener('change', () => {
  selectedFile = fileInput.files[0];
  dropzone.textContent = "已选择文件：" + selectedFile.name;
});

// 上传按钮
document.getElementById('uploadBtn').addEventListener('click', async () => {
  const status = document.getElementById('status');
  if (!selectedFile) {
    status.innerHTML = '<div class="alert alert-warning">请先选择文件。</div>';
    return;
  }

  if (selectedFile.size > MAX_SIZE) {
    status.innerHTML = '<div class="alert alert-danger">文件超过 1GB 限制。</div>';
    return;
  }

  status.innerHTML = '<div class="alert alert-info">正在上传...</div>';

  // ⭐ 使用 Supabase Edge Function 上传
  const uploadUrl = "https://peuvgdtorelifcndzsxg.supabase.co/functions/v1/upload";

  const formData = new FormData();
  formData.append("file", selectedFile);

  const progressBox = document.getElementById('progressBox');
  const progressBar = document.getElementById('progressBar');
  progressBox.style.display = "block";

  const xhr = new XMLHttpRequest();
  xhr.open("POST", uploadUrl);
  
  // ⭐ 必须加这个，否则永远卡住
  xhr.setRequestHeader("Authorization", "Bearer " + SUPABASE_ANON_KEY);

  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) {
      const percent = Math.round((e.loaded / e.total) * 100);
      progressBar.style.width = percent + "%";
      progressBar.textContent = percent + "%";
    }
  };

  xhr.onload = () => {
    if (xhr.status === 200) {
      status.innerHTML = '<div class="alert alert-success">上传成功！</div>';
    } else {
      status.innerHTML = '<div class="alert alert-danger">上传失败：' + xhr.status + '</div>';
    }
  };

  xhr.send(formData);
});
</script>

</body>
</html>
